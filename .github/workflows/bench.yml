name: Benchmark
run-name: "Benchmark on ${{ github.sha }}"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: "Run benchmark"
    runs-on: ubuntu-latest

    steps:
      - uses: "actions/checkout@v7"
        with:
          submodules: true
      - uses: "actions/setup-python@v7"
        with:
          python-version: 3.x

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip setuptools cython

      - name: "Build DAWG"
        run: |
          pip install -e .

      - name: "Run benchmark"
        run: |
          echo "### Benchmark results on commit ($(git rev-parse --short HEAD))" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -VV >> $GITHUB_STEP_SUMMARY
          python -m bench.speed >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
