name: Deploy to pypi.org

on:
  pull_request:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approve_pr_build:
    name: Approve package build for PR
    if: github.event_name == 'pull_request'
    environment: pr-build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Package build approved"

  build_wheels:
    needs: approve_pr_build
    if: >-
      !cancelled() &&
      (needs.approve_pr_build.result == 'success' || needs.approve_pr_build.result == 'skipped')
    name: Build wheels for ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-15
        python-version:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp315"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel

      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64 i686
          CIBW_ARCHS_MACOS: x86_64 arm64 universal2
          CIBW_ARCHS_WINDOWS: AMD64 x86
          CIBW_BUILD: ${{ matrix.python-version }}-*

      - uses: actions/upload-artifact@v7
        with:
          name: artifact_wheels_${{ matrix.python-version }}_${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    needs: approve_pr_build
    if: >-
      !cancelled() &&
      (needs.approve_pr_build.result == 'success' || needs.approve_pr_build.result == 'skipped')
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade cython setuptools

      - name: Build sdist
        run: python setup.py sdist

      - uses: actions/upload-artifact@v7
        with:
          name: artifact_sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload_all:
    name: Publish to PyPI
    permissions:
      contents: read
      id-token: write
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.build_wheels.result == 'success' &&
      needs.build_sdist.result == 'success'

    steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - uses: actions/download-artifact@v8
      with:
        pattern: artifact_*
        merge-multiple: true
        path: dist

    - uses: pypa/gh-action-pypi-publish@v1.14.3
