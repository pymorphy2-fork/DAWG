[project]
name = "DAWG2"
version = "0.13.4"
requires-python = ">=3.10,<3.16"
dynamic = ["classifiers"]
description = "Fast and memory efficient DAWG (DAFSA) for Python"
readme = "README.md"

authors = [
    {name = "Mikhail Korobov", email = "kmike84@gmail.com"}
]
maintainers = [
    {name = "insolor", email = "insolor@gmail.com"}
]


[project.urls]
Homepage = "https://github.com/pymorphy2-fork/DAWG/"
Changelog = "https://github.com/pymorphy2-fork/DAWG/blob/master/CHANGES.md"

[build-system]
requires = ["setuptools", "wheel", "Cython", "tomli; python_version < '3.11'"]

[tool.coverage.run]
plugins = ["Cython.Coverage"]
source = ["src", "tests"]
omit = ["bench/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["UP015"]
unfixable = ["F401"]

[tool.dawg]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
